    </marker>
    <style>
      .heading { font:700 24px Arial,sans-serif; fill:#17324d; }
      .subtitle { font:15px Arial,sans-serif; fill:#52627a; }
      .label { font:700 16px Arial,sans-serif; fill:#26384a; }
      .body { font:14px Arial,sans-serif; fill:#34495e; }

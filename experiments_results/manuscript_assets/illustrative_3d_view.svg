      <stop offset="0" stop-color="#f0c8b8"/>
      <stop offset=".48" stop-color="#d99c91"/>
      <stop offset="1" stop-color="#a95e68"/>
    </linearGradient>
    <linearGradient id="brainSide" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a95e68"/>
      <stop offset="1" stop-color="#74445b"/>
    </linearGradient>
    <radialGradient id="activation">
      <stop offset="0" stop-color="#ef4444" stop-opacity=".88"/>
      <stop offset=".56" stop-color="#f97316" stop-opacity=".62"/>
      <stop offset="1" stop-color="#facc15" stop-opacity=".04"/>
    </radialGradient>

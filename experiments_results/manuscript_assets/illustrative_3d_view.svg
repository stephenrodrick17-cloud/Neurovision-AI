<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative brain-shaped 3D visualization</title>
  <desc id="desc">A brain-inspired side-view illustration with rounded lobes, curved surface folds, a cerebellum, brainstem, and a schematic activation overlay. It is not patient-specific anatomy.</desc>
  <defs>

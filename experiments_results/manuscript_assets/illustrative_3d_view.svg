    <rect x="-8" y="174" width="302" height="148" rx="12" fill="#fff6e6" stroke="#d69b43" stroke-width="1.5"/>
    <text x="10" y="205" class="note">Illustration, not patient anatomy</text>
    <text x="10" y="234" class="body">Brain shape and folds are schematic.</text>
    <text x="10" y="258" class="body">Activation placement and depth</text>
    <text x="10" y="280" class="body">are simulated from one 2D image.</text>
    <text x="10" y="306" class="body">No lesion volume or plan is shown.</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420" role="img" aria-labelledby="title desc">
  <title id="title">NeuroVision-AI study and application workflow</title>
  <desc id="desc">A fixed image manifest feeds model training, validation-based checkpoint selection, and held-out image-level test evaluation. The application shows classification, optional Grad-CAM, and an illustrative simulated 3D view.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#52627a"/>
    </marker>
    <style>
      .box { fill:#f4f7fb; stroke:#31547a; stroke-width:2; rx:14; }
      .accent { fill:#eaf4ee; stroke:#28724a; stroke-width:2; rx:14; }
      .warn { fill:#fff6e6; stroke:#a86b16; stroke-width:2; rx:14; }
      .title { font:700 19px Arial,sans-serif; fill:#17324d; text-anchor:middle; }
      .body { font:15px Arial,sans-serif; fill:#26384a; text-anchor:middle; }
      .small { font:14px Arial,sans-serif; fill:#52627a; text-anchor:middle; }
      .arrow { stroke:#52627a; stroke-width:2.5; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect width="1120" height="420" fill="#ffffff"/>
  <text x="560" y="36" class="title">NeuroVision-AI: image-level evaluation and interactive display</text>

  <rect x="32" y="92" width="190" height="94" class="box"/>
  <text x="127" y="124" class="title">Local image set</text>
  <text x="127" y="151" class="body">2D files and</text>
  <text x="127" y="172" class="body">folder-derived labels</text>

  <rect x="270" y="92" width="190" height="94" class="box"/>
  <text x="365" y="124" class="title">Fixed manifest</text>
  <text x="365" y="151" class="body">Train / validation /</text>
  <text x="365" y="172" class="body">held-out test split</text>

  <rect x="510" y="92" width="190" height="94" class="accent"/>
  <text x="605" y="124" class="title">Training</text>
  <text x="605" y="151" class="body">Train split only</text>
  <text x="605" y="172" class="body">model updates</text>

  <rect x="750" y="92" width="165" height="94" class="accent"/>
  <text x="832" y="124" class="title">Selection</text>
  <text x="832" y="151" class="body">Validation balanced</text>
  <text x="832" y="172" class="body">accuracy</text>

  <rect x="955" y="92" width="145" height="94" class="box"/>
  <text x="1027" y="124" class="title">Evaluation</text>
  <text x="1027" y="151" class="body">Fixed test set</text>
  <text x="1027" y="172" class="body">threshold = 0.5</text>

  <path d="M222 139 H264" class="arrow"/>
  <path d="M460 139 H504" class="arrow"/>
  <path d="M700 139 H744" class="arrow"/>
  <path d="M915 139 H949" class="arrow"/>

  <path d="M1027 186 V238 H830" class="arrow"/>
  <rect x="650" y="238" width="360" height="88" class="box"/>
  <text x="830" y="269" class="title">Interactive application</text>
  <text x="830" y="296" class="body">Prediction + optional qualitative Grad-CAM</text>
  <text x="830" y="316" class="body">+ illustrative 3D display</text>

  <rect x="110" y="238" width="400" height="88" class="warn"/>
  <text x="310" y="270" class="title">Interpretation limits</text>
  <text x="310" y="297" class="body">No patient IDs, external cohort,</text>
  <text x="310" y="317" class="body">expert masks, or validated 3D geometry</text>
  <path d="M650 282 H516" class="arrow"/>

  <text x="560" y="382" class="small">Duplicate screening supports image-level separation only; it does not establish patient-level independence.</text>
</svg>

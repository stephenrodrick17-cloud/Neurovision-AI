<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420" role="img" aria-labelledby="title desc">
  <title id="title">Image preprocessing sequence</title>
  <desc id="desc">Images are converted to RGB and directly resized to 224 by 224. Training-only flip and rotation occur before tensor conversion and normalization. Validation, test, and default inference omit augmentation.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#52627a"/>
    </marker>
    <style>
      .box { fill:#f4f7fb; stroke:#31547a; stroke-width:2; rx:12; }
      .train { fill:#eaf4ee; stroke:#28724a; stroke-width:2; rx:12; }
      .eval { fill:#fff6e6; stroke:#a86b16; stroke-width:2; rx:12; }
      .title { font:700 17px Arial,sans-serif; fill:#17324d; text-anchor:middle; }
      .body { font:14px Arial,sans-serif; fill:#26384a; text-anchor:middle; }
      .note { font:14px Arial,sans-serif; fill:#52627a; text-anchor:middle; }
      .arrow { stroke:#52627a; stroke-width:2.4; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect width="1120" height="420" fill="#ffffff"/>
  <text x="560" y="36" class="title">Shared preprocessing with training-only augmentation</text>

  <rect x="38" y="135" width="175" height="90" class="box"/>
  <text x="125" y="169" class="title">Input image</text>
  <text x="125" y="196" class="body">Convert to RGB</text>

  <rect x="270" y="135" width="190" height="90" class="box"/>
  <text x="365" y="169" class="title">Resize</text>
  <text x="365" y="196" class="body">224 × 224, bilinear</text>

  <rect x="525" y="65" width="235" height="92" class="train"/>
  <text x="642" y="99" class="title">Training only</text>
  <text x="642" y="126" class="body">Horizontal flip p = 0.5</text>
  <text x="642" y="147" class="body">Rotation up to ±10°</text>

  <rect x="525" y="230" width="235" height="92" class="eval"/>
  <text x="642" y="264" class="title">Validation / test / app</text>
  <text x="642" y="292" class="body">No augmentation</text>

  <rect x="830" y="135" width="245" height="90" class="box"/>
  <text x="952" y="169" class="title">Tensor + normalize</text>
  <text x="952" y="196" class="body">[0,1], then ImageNet mean/std</text>

  <path d="M213 180 H264" class="arrow"/>
  <path d="M460 180 H492 V111 H519" class="arrow"/>
  <path d="M460 180 H492 V276 H519" class="arrow"/>
  <path d="M760 111 H790 V180 H824" class="arrow"/>
  <path d="M760 276 H790 V180 H824" class="arrow"/>

  <text x="560" y="368" class="note">No crop, contour selection, extreme-point detection, or tumor bounding-box crop.</text>
  <text x="560" y="393" class="note">Optional application brightness/contrast/sharpness controls were not used for reported test metrics.</text>
</svg>
